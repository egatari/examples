<!DOCTYPE html>
<html lang="ja" data-theme="egatari-brand">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egatari CM 学習者向け（30 秒）</title>
<!--
  学習者向けの 30 秒の CM（作者 11/25：構成の案 2 を 30 秒に）。配られる PDF のスライドと比べ、「動く・聴ける・読める・書ける」を 1 小節ずつ見せる。
  画面の写しは使わず、Egatari の動き（モーフ・ステップ・描く線）だけ。「」は使わず、PDF は色づいて動き出す。本は見開き（のど・ページ番号・番号つき見出し）で 1 回めくる（作者 11/25）。12 小節（96 BPM、1 小節 2.5 秒）、1 コマ 2 小節。右下のページ番号は出さない（.pn）。声なし（台本は字と同じ文で、読み上げない）。
  図の中身は形だけ（棒・行に意味はない）。PDF は一般の形として描き、実在の製品のロゴは出さない。
-->
<style>
.cm-box { position: relative; height: 540px; }
.cm-box > * { position: absolute; }
.cm-frame { border: 4px solid var(--title); border-radius: 12px; background: var(--bg); }
.cm-pdf { border-color: color-mix(in srgb, var(--muted) 70%, var(--bg)); }
.cm-ink { fill: none; stroke: var(--title); stroke-linecap: round; }
.cm-bar { fill: none; stroke: var(--term); stroke-width: 70; stroke-linecap: butt; }
.cm-bar-e { stroke: var(--emph); }
.cm-ln { fill: none; stroke: color-mix(in srgb, var(--muted) 55%, var(--bg)); stroke-linecap: round; }
.cm-dot { fill: var(--term); }
.cm-grey .cm-ink, .cm-grey .cm-bar { stroke: color-mix(in srgb, var(--muted) 45%, var(--bg)); }
.cm-grey .cm-dot { fill: color-mix(in srgb, var(--muted) 45%, var(--bg)); }
.cm-tag { left: 262px; top: 448px; padding: 0 14px; border-radius: 8px; font-weight: 700; color: var(--bg); background: var(--muted); }
.cm-mute path, .cm-mute line { fill: none; stroke: color-mix(in srgb, var(--muted) 75%, var(--bg)); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
.cm-band { left: 192px; top: 436px; width: 800px; height: 92px; border-radius: 14px; background: color-mix(in srgb, var(--fg) 85%, var(--bg)); color: var(--bg); display: flex; align-items: center; gap: 0; padding-left: 110px; font-size: 32px; box-sizing: border-box; }
.cm-spk { left: 214px; top: 452px; }
.cm-spk path { fill: none; stroke: var(--bg); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.cm-hl { fill: none; stroke: color-mix(in srgb, var(--brand-hl) 60%, var(--bg)); stroke-width: 30; stroke-linecap: butt; }
.cm-hide { fill: var(--brand-hl); }
.cm-pen { fill: none; stroke: var(--emph); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.cm-penbody { fill: var(--fg); }
.cm-pentip { fill: var(--emph); }
.cm-gut { fill: color-mix(in srgb, var(--muted) 14%, var(--bg)); }
.cm-gutl { fill: none; stroke: color-mix(in srgb, var(--muted) 45%, var(--bg)); stroke-width: 2; }
.cm-bh { fill: var(--title); font-size: 26px; font-weight: 700; }
.cm-tl { fill: none; stroke: color-mix(in srgb, var(--muted) 55%, var(--bg)); stroke-width: 10; stroke-linecap: round; }
.cm-pg { fill: var(--muted); font-size: 24px; text-anchor: middle; }
.cm-pg-bg { fill: var(--bg); }
.cm-turn { fill: var(--bg); stroke: color-mix(in srgb, var(--muted) 50%, var(--bg)); stroke-width: 3; filter: drop-shadow(-10px 0 12px color-mix(in srgb, var(--fg) 25%, transparent)); }
.cm-turn-l { filter: drop-shadow(10px 0 12px color-mix(in srgb, var(--fg) 25%, transparent)); }
.pn { visibility: hidden; }
.cover .cm-logo { position: absolute; left: calc(50% - 95px); top: 90px; }
.cover h1 { top: 300px; }
.cover .au { top: 470px; }
</style>
</head>
