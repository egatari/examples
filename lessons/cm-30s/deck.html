<!DOCTYPE html>
<html lang="ja" data-theme="egatari-brand">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egatari CM（30 秒）</title>
<!--
  作成者向けの 30 秒の CM（作者 11/25：1 つの題材「月の満ち欠け」を通し、作ったスライドがそのまま会場で発表される）。
  画面の写しは使わず、Egatari の動き（モーフ・ステップ・パーツ）だけ。12 小節（96 BPM、1 小節 2.5 秒）。学習者向けの 30 秒と同じ曲・テンポ。
  字は 2 行（見出しの行）。会場は手元のノート PC の発表者ビュー（今・次・経過・台本の行・次へ。画面の半分より広く、台本の字が読める大きさ）と、小さなスクリーン（スライドだけ）の 2 画面。ポインタが次へのボタンへ動いて押し（ボタンが沈む）、また離れる。動画は仮想の時刻でコマを撮るので、ポインタの動きはステップの持ち上がり（.cm-ptrbox を回して大きくした枠）で作る。声なし（台本は字と同じ文で、読み上げない）。右下のページ番号は出さない（.pn）。
-->
<style>
.cm-box { position: relative; height: 540px; }
.cm-box > * { position: absolute; }
.cm-sheet { fill: var(--bg); stroke: var(--title); stroke-width: 5; }
.cm-memo { fill: var(--fg); font-size: 34px; font-weight: 700; }
.cm-memo2 { fill: var(--fg); font-size: 28px; }
.cm-arrow { fill: none; stroke: var(--term); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
.cm-bubble { border: 4px solid var(--line); border-radius: 28px; background: var(--bg); }
.cm-code { border-radius: 12px; background: color-mix(in srgb, var(--muted) 16%, var(--bg)); }
.cm-ln { position: absolute; left: 22px; height: 14px; border-radius: 7px; background: color-mix(in srgb, var(--muted) 55%, var(--bg)); }
.cm-frame { border: 4px solid var(--title); border-radius: 12px; background: var(--bg); }
.cm-in-h { font-weight: 700; color: var(--title); border-bottom: 3px solid var(--title); }
.cm-room { left: 0; top: -8px; width: 1184px; height: 546px; background: color-mix(in srgb, var(--fg) 88%, var(--bg)); }
.cm-screen { box-shadow: 0 0 60px color-mix(in srgb, var(--bg) 35%, transparent); }
.cm-presenter { fill: color-mix(in srgb, var(--fg) 55%, var(--bg)); }
.cm-arm { fill: none; stroke: color-mix(in srgb, var(--fg) 55%, var(--bg)); stroke-width: 24; stroke-linecap: round; }
.cm-aud { fill: color-mix(in srgb, var(--fg) 70%, var(--bg)); }
.cm-laptop rect { fill: color-mix(in srgb, var(--fg) 70%, var(--bg)); }
.cm-laptop path { fill: color-mix(in srgb, var(--fg) 55%, var(--bg)); }
.cm-pv-bg { fill: color-mix(in srgb, var(--fg) 92%, var(--bg)); }
.cm-pv-slide { fill: var(--bg); }
.cm-pv-ttl { stroke: var(--title); stroke-width: 8; stroke-linecap: round; }
.cm-mn { fill: color-mix(in srgb, var(--muted) 70%, var(--bg)); }
.cm-ml { fill: var(--brand-hl); }
.cm-pv-lab { fill: var(--bg); font-size: 24px; font-weight: 700; }
.cm-pv-lab2 { fill: var(--bg); font-size: 24px; }
.cm-pv-tbar { fill: var(--brand-hl); }
.cm-pv-ln { fill: var(--bg); font-size: 24px; }
.cm-pv-hl { fill: var(--term); }
.cm-pv-btn { fill: var(--term); }
.cm-pv-btxt { fill: var(--bg); font-size: 24px; font-weight: 700; text-anchor: middle; }
.cm-pv-btn2 { fill: color-mix(in srgb, var(--term) 70%, var(--fg)); }
.cm-pv-btn-sh { fill: color-mix(in srgb, var(--term) 55%, var(--fg)); }
.cm-btn { overflow: visible; }
.cm-ptrbox { width: 0; height: 0; transform-origin: 0 0; transform: rotate(var(--r)) scale(7); }
.cm-ptrbox > div { position: absolute; left: 0; top: 0; }
.cm-ptr { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: scale(0.142857) rotate(calc(-1 * var(--r))); }
.cm-ptr-p { fill: var(--bg); stroke: var(--fg); stroke-width: 3; stroke-linejoin: round; }
.cm-scr-bg { fill: var(--bg); }
.cm-orb { fill: none; stroke: var(--muted); stroke-width: 3; stroke-dasharray: 6 8; }
.cm-earth { fill: var(--term); }
.cm-moon { fill: var(--brand-hl); stroke: var(--fg); stroke-width: 2; }
.cm-btxt-l { z-index: 2; pointer-events: none; }
.pn { visibility: hidden; }
.cover .cm-logo { position: absolute; left: calc(50% - 95px); top: 90px; }
.cover h1 { top: 300px; }
.cover .au { top: 470px; }
</style>
</head>
